name: Assemble attached resume

on:
  push:
    paths:
      - '.resume-parts/ready'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact attached PDF
        shell: bash
        run: |
          cat .resume-parts/part-* | tr -d '\n\r ' | base64 --decode > CJ-Higgins-Resume.pdf
          echo '3a514b5c7d88d94e9a5b1a206087f73f079ac74da451441ceaebdcdb3f324a56  CJ-Higgins-Resume.pdf' | sha256sum --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CJ-Higgins-Resume.pdf
          git rm -r .resume-parts
          git rm .github/workflows/assemble-resume.yml
          git commit -m 'Use attached resume PDF'
          git push
